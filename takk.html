<!DOCTYPE html>

<head>

<title>Takk! | Norsemen Assistance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23102131'/%3E%3Ccircle cx='20' cy='20' r='15' fill='none' stroke='%23e0992f' stroke-width='2.4'/%3E%3Cpath d='M20 9v19M20 11l8 14h-8' fill='none' stroke='%23eef2f5' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F1E8;--ink:#13263A;--muted:#4F5F70;--line:#E4DCCE;--clay:#1B6670;--clay-deep:#124A52;--dark:#102131}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:11px;background:var(--dark);border-radius:999px;padding:10px 22px 10px 12px;margin-bottom:34px;text-align:left}
.brand svg{width:36px;height:36px}
.brand b{color:#EEF2F5;font-size:1rem;line-height:1.15}
.brand small{display:block;font-size:.72rem;font-weight:500;color:#A8B8C6}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(16,33,49,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-weight:800;font-size:1.7rem;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.08rem;max-width:36ch;margin:0 auto}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:.95rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#e0992f" stroke-width="2"/><path d="M20 6 L20 30 M20 8 L30 26 L20 26" fill="none" stroke="#eef2f5" stroke-width="2" stroke-linejoin="round"/><path d="M8 30 Q14 27 20 30 T32 30" fill="none" stroke="#e0992f" stroke-width="2" stroke-linecap="round"/></svg><b>Norsemen Assistance<small>Torrevieja &middot; Costa Blanca</small></b></div>
  <div class="card">
    <span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>Takk! Vi har f&aring;tt meldingen din</h1>
    <p>Vi tar kontakt s&aring; snart vi kan, som regel samme dag p&aring; hverdager. Pris avtaler vi f&oslash;r vi starter.</p>
    <a class="back" href="https://norsemenassistance.com/">G&aring; til norsemenassistance.com</a>
  </div>
